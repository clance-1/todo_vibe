name: AWS Deployment

on:
  push:
    branches:
      - aws-deployment

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build and Push Docker Images
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
        run: |
          echo "$DOCKER_PASSWORD" | docker login -u "$DOCKER_USERNAME" --password-stdin
          docker build -t $DOCKER_USERNAME/flask-todo-app:latest .
          docker push $DOCKER_USERNAME/flask-todo-app:latest

      - name: Install AWS CLI and EB CLI, verify credentials
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pip
          pip3 install --upgrade --user awscli awsebcli
          export PATH=$PATH:~/.local/bin
          echo "AWS CLI: $(aws --version)"
          echo "EB CLI: $(eb --version)"
          echo "Verifying AWS credentials..."
          aws sts get-caller-identity || (echo "Invalid AWS credentials" && exit 1)
          if [ -z "$AWS_REGION" ]; then
            echo "Repository secret 'AWS_REGION' is not set. Falling back to 'ap-southeast-2'."
            AWS_REGION="ap-southeast-2"
          fi
          case "$AWS_REGION" in
            southeast-2) AWS_REGION="ap-southeast-2" ;;
            southeast-1) AWS_REGION="ap-southeast-1" ;;
            *) AWS_REGION="$AWS_REGION" ;;
          esac
          export AWS_DEFAULT_REGION="$AWS_REGION"
          echo "Using AWS region: $AWS_REGION"

      - name: Deploy to AWS Elastic Beanstalk (use env 'clance')
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
        run: |
          export PATH=$PATH:~/.local/bin
          # Initialize EB app (app name 'my-todo-app' used as placeholder)
          eb init -p docker my-todo-app --region $AWS_DEFAULT_REGION || true
          # Select and deploy to the provided environment name 'clance'
          eb use clance || true
          eb deploy clance
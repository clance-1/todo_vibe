name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: todo_user
          POSTGRES_PASSWORD: secret
          POSTGRES_DB: todo_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U todo_user"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    strategy:
      matrix:
        python-version: [3.11]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Wait for Postgres
        run: |
          echo "Waiting for Postgres to be ready..."
          sudo apt-get update
          sudo apt-get install -y postgresql-client
          for i in {1..60}; do
            PGPASSWORD=secret psql -h localhost -U todo_user -d todo_db -c '\q' && break
            echo "Postgres not ready yet, retrying..."
            sleep 1
          done
      - name: Run DB migrations
        env:
          SQLALCHEMY_DATABASE_URI: postgresql+psycopg://todo_user:secret@127.0.0.1:5432/todo_db
        run: |
          alembic upgrade head
      - name: Run tests
        env:
          SQLALCHEMY_DATABASE_URI: postgresql+psycopg://todo_user:secret@127.0.0.1:5432/todo_db
        run: |
          python -m pytest -q

  notify:
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'pull_request'
    steps:
      - name: Post PR comment with CI result
        uses: actions/github-script@v7
        env:
          JOB_RESULT: ${{ needs.test.result }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const pr = context.payload.pull_request;
            if (!pr) {
              core.info('No pull_request context; skipping comment.');
            } else {
              const owner = context.repo.owner;
              const repo = context.repo.repo;
              const issue_number = pr.number;
              const body = `CI result for commit ${process.env.GITHUB_SHA.slice(0,7)}: **${process.env.JOB_RESULT}**\n\nSee workflow run: ${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`;
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

name: CI

on:
  push:
    branches: [ main, master, aws-deployment ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: todo_user
          POSTGRES_PASSWORD: secret
          POSTGRES_DB: todo_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U todo_user"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    strategy:
      matrix:
        python-version: [3.11]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Wait for Postgres
        run: |
          echo "Waiting for Postgres to be ready..."
          sudo apt-get update
          sudo apt-get install -y postgresql-client
          for i in {1..60}; do
            PGPASSWORD=secret psql -h localhost -U todo_user -d todo_db -c '\q' && break
            echo "Postgres not ready yet, retrying..."
            sleep 1
          done
      - name: Run DB migrations
        env:
          SQLALCHEMY_DATABASE_URI: postgresql+psycopg://todo_user:secret@127.0.0.1:5432/todo_db
        run: |
          alembic upgrade head
      - name: Run tests
        env:
          SQLALCHEMY_DATABASE_URI: postgresql+psycopg://todo_user:secret@127.0.0.1:5432/todo_db
        run: |
          python -m pytest -q

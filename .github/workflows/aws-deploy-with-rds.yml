name: Build, Migrate and Deploy (with RDS)

on:
  push:
    branches: [ aws-deployment ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      AWS_REGION: ap-southeast-2
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        run: |
          IMAGE_NAME=${{ secrets.DOCKERHUB_USERNAME }}/flask-todo-app:latest
          docker build -t $IMAGE_NAME .
          docker push $IMAGE_NAME

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Optional: create RDS snapshot
        if: ${{ secrets.RDS_CREATE_SNAPSHOT == 'true' }}
        run: |
          aws rds create-db-snapshot --db-instance-identifier ${{ secrets.RDS_INSTANCE_IDENTIFIER }} --db-snapshot-identifier before-deploy-$(date +%s) --region ${{ env.AWS_REGION }}

      - name: Install dependencies for migrations
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Alembic migrations
        env:
          SQLALCHEMY_DATABASE_URI: postgresql+psycopg://
            ${{ secrets.RDS_MASTER_USERNAME }}:${{ secrets.RDS_MASTER_PASSWORD }}@${{ secrets.RDS_HOST }}:${{ secrets.RDS_PORT || '5432' }}/${{ secrets.RDS_DB || 'postgres' }}
        run: |
          export SQLALCHEMY_DATABASE_URI
          alembic upgrade head

      - name: Install EB CLI
        run: |
          python -m pip install --upgrade pip
          pip install awsebcli

      - name: Configure EB and set environment variables
        env:
          SQLALCHEMY_DATABASE_URI: postgresql+psycopg://
            ${{ secrets.RDS_MASTER_USERNAME }}:${{ secrets.RDS_MASTER_PASSWORD }}@${{ secrets.RDS_HOST }}:${{ secrets.RDS_PORT || '5432' }}/${{ secrets.RDS_DB || 'postgres' }}
          AWS_REGION: ${{ env.AWS_REGION }}
        run: |
          eb init ${! EB_APP_NAME:-${{ secrets.EB_APP_NAME }}} --region $AWS_REGION || true
          eb use ${! EB_ENV_NAME:-${{ secrets.EB_ENV_NAME }}} || true
          eb setenv SQLALCHEMY_DATABASE_URI="$SQLALCHEMY_DATABASE_URI"

      - name: Deploy to Elastic Beanstalk
        run: |
          eb deploy ${! EB_ENV_NAME:-${{ secrets.EB_ENV_NAME }}}

<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Register - ToDo Demo</title>
</head>
<body>
  <h1>회원가입</h1>
  <form method="post" action="/register">
    <label>사용자명: <input name="username" placeholder="사용자명"></label><br>
    <label>비밀번호: <input name="password" type="password" placeholder="비밀번호"></label><br>
    <button type="submit">회원가입</button>
  </form>
  <p>이미 계정이 있으신가요? <a href="/login">로그인</a></p>
  {% with messages = get_flashed_messages() %}
    {% if messages %}
      <ul>
      {% for m in messages %}
        <li>{{ m }}</li>
      {% endfor %}
      </ul>
    {% endif %}
  {% endwith %}
</body>
</html>

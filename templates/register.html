{% extends 'base.html' %}

{% block title %}Register - ToDo Demo{% endblock %}

{% block content %}
  <div class="row justify-content-center">
    <div class="col-md-6">
      <h1 class="mb-3">회원가입</h1>
      <form method="post" action="/register">
        <div class="mb-3">
          <label class="form-label">사용자명</label>
          <input name="username" class="form-control" placeholder="사용자명">
        </div>
        <div class="mb-3">
          <label class="form-label">비밀번호</label>
          <input name="password" type="password" class="form-control" placeholder="비밀번호">
        </div>
        <button type="submit" class="btn btn-success">회원가입</button>
      </form>
      <p class="mt-3">이미 계정이 있으신가요? <a href="/login">로그인</a></p>
    </div>
  </div>
{% endblock %}

<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>ToDo - Demo</title>
  <style>
    .item { padding:8px; margin:4px; border-radius:4px; }
    .cat-study { background:#ffcccc; }
    .cat-personal { background:#cce5ff; }
    .cat-work { background:#ccffcc; }
  </style>
</head>
<body>
  <h1>ToDo List</h1>
  <p>Logged in as {{ current_user.username }} — <a href="/logout">Logout</a></p>

  <div>
    <label>Date: <input type="date" id="filter-date"></label>
    <label>Category:
      <select id="filter-cat">
        <option value="">All</option>
        <option value="study">학습</option>
        <option value="personal">개인</option>
        <option value="work">업무</option>
      </select>
    </label>
    <button id="apply">Apply</button>
  </div>

  <h2>Create</h2>
  <div>
    <input id="title" placeholder="title">
    <input type="date" id="date" value="">
    <select id="category">
      <option value="study">학습</option>
      <option value="personal">개인</option>
      <option value="work">업무</option>
    </select>
    <button id="create">Create</button>
  </div>

  <h2>Items</h2>
  <div id="items"></div>

<script>
async function fetchItems(){
  const date = document.getElementById('filter-date').value
  const cat = document.getElementById('filter-cat').value
  let url = '/api/todos'
  const params = []
  if(date) params.push('date='+date)
  if(cat) params.push('category='+cat)
  if(params.length) url += '?' + params.join('&')
  const res = await fetch(url)
  const data = await res.json()
  const container = document.getElementById('items')
  container.innerHTML = ''
  data.forEach(i=>{
    const div = document.createElement('div')
    div.className = 'item ' + (i.category==='study'?'cat-study':(i.category==='personal'?'cat-personal':'cat-work'))
    div.innerHTML = `<strong>${i.title}</strong> <em>${i.date}</em> <button data-id="${i.id}" class="del">Delete</button>`
    container.appendChild(div)
  })
}

document.getElementById('apply').addEventListener('click', fetchItems)

document.getElementById('create').addEventListener('click', async ()=>{
  const title = document.getElementById('title').value
  const date = document.getElementById('date').value
  const category = document.getElementById('category').value
  const res = await fetch('/api/todos', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({title, date, category})})
  if(res.status===201){
    document.getElementById('title').value=''
    fetchItems()
  } else {
    alert('create failed')
  }
})

document.getElementById('items').addEventListener('click', async (e)=>{
  if(e.target.classList.contains('del')){
    const id = e.target.dataset.id
    await fetch('/api/todos/'+id, {method:'DELETE'})
    fetchItems()
  }
})

// initial load
fetchItems()
</script>
</body>
</html>

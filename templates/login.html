{% extends 'base.html' %}

{% block title %}Login - ToDo Demo{% endblock %}

{% block content %}
  <div class="row justify-content-center">
    <div class="col-md-6">
      <h1 class="mb-3">로그인</h1>
      <form method="post" action="/login">
        <div class="mb-3">
          <label class="form-label">사용자명</label>
          <input name="username" class="form-control" placeholder="사용자명">
        </div>
        <div class="mb-3">
          <label class="form-label">비밀번호</label>
          <input name="password" type="password" class="form-control" placeholder="비밀번호">
        </div>
        <button type="submit" class="btn btn-primary">로그인</button>
      </form>
      <p class="mt-3">계정이 없으신가요? <a href="/register">회원가입</a></p>
    </div>
  </div>
{% endblock %}
